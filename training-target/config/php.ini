; HWP Training Target — Permissive PHP settings for security training
; DO NOT USE ON PRODUCTION SERVERS

; File uploads (needed for AFU/RFI testing)
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Allow URL fopen (needed for RFI/SSRF testing)
allow_url_fopen = On
allow_url_include = Off

; Error display (helpful for training)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Execution limits (generous for training)
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
